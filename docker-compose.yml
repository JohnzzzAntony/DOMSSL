name: certguard

services:
  # ── Web application (includes in-process worker + scheduler) ──
  web:
    build: .
    container_name: certguard-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32-chars-minimum-secret}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - NODE_ENV=production
    volumes:
      - certguard-data:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Optional: PostgreSQL for multi-instance deployments (spec §60) ──
  # Switch prisma/schema.prisma provider to "postgresql", set
  # DATABASE_URL=postgresql://certguard:secret@postgres:5432/certguard
  # and start with: docker compose --profile postgres up -d
  postgres:
    image: postgres:16-alpine
    container_name: certguard-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=certguard
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=certguard
    volumes:
      - certguard-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Optional: Redis + BullMQ worker scaling (spec §3/§36) ──
  redis:
    image: redis:7-alpine
    container_name: certguard-redis
    profiles: ["redis"]
    volumes:
      - certguard-redis:/data
    restart: unless-stopped

  # ── Optional: reverse proxy with TLS (spec §60) ──
  nginx:
    image: nginx:alpine
    container_name: certguard-nginx
    profiles: ["nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certguard-certs:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  certguard-data:
  certguard-pgdata:
  certguard-redis:
  certguard-certs:
